# Render Blueprint: one click creates the web app + free Postgres database.
services:
  - type: web
    name: smart-campus-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false          # you type this in during setup: that account becomes admin
      - key: DATABASE_URL
        fromDatabase:
          name: smart-campus-db
          property: connectionString
databases:
  - name: smart-campus-db
    plan: free
